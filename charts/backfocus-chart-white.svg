<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
	 width="1920"
	 height="1080"
	 viewBox="0 0 1920 1080"
	 version="1.1"
	 xmlns:xlink="http://www.w3.org/1999/xlink"
	 xmlns="http://www.w3.org/2000/svg"
	 xmlns:svg="http://www.w3.org/2000/svg">
	<defs>
		<g id="chart" stroke="none">
			<g id="quarter">
				<path id="segment" d="M0,0 v-1000 A1000 1000 0 0 1 87.1556 -996.1947" />
				<use href="#segment" transform="rotate(10)" />
				<use href="#segment" transform="rotate(20)" />
				<use href="#segment" transform="rotate(30)" />
				<use href="#segment" transform="rotate(40)" />
				<use href="#segment" transform="rotate(50)" />
				<use href="#segment" transform="rotate(60)" />
				<use href="#segment" transform="rotate(70)" />
				<use href="#segment" transform="rotate(80)" />
			</g>
			<use href="#quarter" transform="rotate(90)" />
			<use href="#quarter" transform="rotate(180)" />
			<use href="#quarter" transform="rotate(270)" />
		</g>
	</defs>
	<!-- Change black & white on the next 2 lines to set background & foreground colors -->
	<rect fill="white" width="100%" height="100%" />
	<g fill="black">
		<use href="#chart" transform="translate(960 540) scale(0.52)" />
		<use href="#chart" transform="translate(230 230) scale(0.23)" />
		<use href="#chart" transform="translate(230 850) scale(0.23)" />
		<use href="#chart" transform="translate(1690 230) scale(0.23)" />
		<use href="#chart" transform="translate(1690 850) scale(0.23)" />
	</g>
</svg>
